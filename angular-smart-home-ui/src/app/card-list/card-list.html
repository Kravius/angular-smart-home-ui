<ul class="cards-container">
  @if (dashboardListTabOne()) {
    @for (tab of dashboardListTabOne().cards; track tab.id) {
      <li class="cards-container__item">
        <app-card [entityCard]="tab"></app-card>
      </li>
    }
  } @else {
    <li>
      <h1>{{ dashboardTabsErrorMessage() }}</h1>
    </li>
  }
</ul>
