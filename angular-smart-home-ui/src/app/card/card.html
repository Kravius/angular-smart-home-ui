<div>{{ entityCard().id }}</div>

<!-- @for (cardItem of entityCard().items; track $index) {
} -->

<mat-card class="example-card" [ngClass]="directionLayout()" appearance="outlined">
  <mat-card-header>
    <!-- <div mat-card-avatar class="example-header-image"></div> -->
    <!-- <mat-card-subtitle>Dog Breed</mat-card-subtitle> -->
    <mat-card-title>{{ entityCard().title }}</mat-card-title>
  </mat-card-header>
  @for (item of entityCard().items; track $index) {
  <mat-card-content>
    <p>{{ item.label }}</p>
    <mat-icon
      aria-hidden="false"
      aria-label="Example home icon"
      [fontIcon]="item?.icon ?? ''"
    ></mat-icon>
    @if (item.type === 'sensor') {
    <p>{{ `${item.value.amount}${item.value.unit}`}}</p>
    <!-- <button matButton>LIKE</button> -->
    }
    <mat-card-actions> </mat-card-actions>
  </mat-card-content>

  }
</mat-card>
