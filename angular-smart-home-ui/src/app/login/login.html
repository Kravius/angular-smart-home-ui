<form class="form-container" [formGroup]="loginForm.userForm" (ngSubmit)="submitLogin()">
  <div class="login-container">
    <h1>Welcome To Smart Home</h1>
    <mat-error>{{ unauthorizedErrorMessage() }}</mat-error>
    <mat-form-field floatLabel="always">
      <mat-label>user</mat-label>
      <input
        formControlName="username"
        matInput
        [ngClass]="['value--login-name', 'login-inputs']"
        placeholder="Enter your name"
      />
      @if(loginForm.userForm.controls.username.hasError('required')){
      <mat-error>Name is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Enter your password</mat-label>
      <input
        formControlName="password"
        [ngClass]="['value--login-password', 'login-inputs']"
        matInput
        [type]="hide() ? 'password' : 'text'"
      />
      <button
        matIconButton
        matSuffix
        (click)="clickEvent($event)"
        [attr.aria-label]="'Hide password'"
        [attr.aria-pressed]="hide()"
      >
        <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      @if (loginForm.userForm.controls.password.hasError('required')) {
      <mat-error>Password is required </mat-error>
      }
    </mat-form-field>
    <button
      type="submit"
      [class.login-button]="!loginForm.userForm.invalid"
      [disabled]="loginForm.userForm.invalid"
    >
      Login
    </button>
  </div>
</form>
