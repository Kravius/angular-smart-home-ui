<li [class]="layout()">
  <div class="item-lable">
    <p>{{ entity().label }}</p>
  </div>
  <div class="item-icon">
    <mat-icon
      aria-hidden="false"
      aria-label="Example home icon"
      [fontIcon]="entity().icon"
    ></mat-icon>
  </div>
  <div class="item-value">
    <p>{{ entity().value | sensorValue }}</p>
  </div>
  <!-- </div> -->
</li>
