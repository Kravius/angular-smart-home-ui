<div class="btn-container">
  @if (!isEditMode()) {
    <button matMiniFab extended (click)="enterEditMode()">
      <mat-icon>create</mat-icon>
    </button>
  }
  @if (isEditMode()) {
    <button mat-mini-fab (click)="saveDashboard()">Save</button>
    <button mat-mini-fab (click)="discardChanges()">Cancel</button>
  }
</div>
