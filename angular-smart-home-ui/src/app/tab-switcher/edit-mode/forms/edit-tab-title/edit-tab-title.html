@if (isEditing()) {
  <form (ngSubmit)="save.emit()" class="inline-form">
    <mat-form-field appearance="outline">
      <input matInput [formControl]="editService.tabTitleControl" placeholder="Tab title" />
    </mat-form-field>
    <button
      mat-icon-button
      type="submit"
      color="primary"
      [disabled]="editService.tabTitleControl.invalid"
    >
      <mat-icon>check</mat-icon>
    </button>
    <button mat-icon-button type="button" (click)="cancel.emit()">
      <mat-icon>close</mat-icon>
    </button>
  </form>
} @else {
  <a mat-tab-link [routerLink]="link()" [active]="active()" (click)="click.emit()">
    {{ title() }}
  </a>
  <button mat-icon-button (click)="editClick.emit()">
    <mat-icon>create</mat-icon>
  </button>
}
