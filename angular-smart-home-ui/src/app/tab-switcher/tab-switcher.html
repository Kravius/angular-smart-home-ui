@if (isEditMode()) {
  <div class="dashboard-title-container">
    @if (isEditDashboardTitle()) {
      <input type="text" />
    } @else {
      <h1 class="dashboard-title">{{ dashboardId() }}</h1>
    }
    <button mat-mini-fab (click)="editModeDashboardTitle()">
      <mat-icon>create</mat-icon>
    </button>
  </div>
}
<nav mat-tab-nav-bar [tabPanel]="tabPanel" class="container">
  @if (dashboardListTab().tabs.length === 0) {
    <p>Create your first tab</p>
  }
  @for (tab of dashboardListTab().tabs; track $index) {
    <!-- @if (isEditTabTitle() && tabId() === tab.id) {
      <input type="text" />
    } @else {
      <a
        mat-tab-link
        [routerLink]="['/dashboards', dashboardIdTabStore(), tab.id]"
        (click)="setTabsIdStore(tab.id)"
        [active]="tabId() === tab.id"
      >
        {{ tab.id | uppercase }}
      </a>
    }

    @if (isEditMode() && tabId() === tab.id) {
      <button matMiniFab extended (click)="editModeTabTitle()">
        <mat-icon>create</mat-icon>
      </button>
    } -->
    <app-edit-tab-title
      [isEditing]="isEditTabTitle() && tabId() === tab.id"
      [title]="tab.title || tab.id"
      [link]="['/dashboards', dashboardId(), tab.id]"
      [active]="tabId() === tab.id"
      (click)="setTabsIdStore(tab.id)"
      (editClick)="onEditTabTitle()"
      (save)="onSaveTabTitle(tab.id)"
      (cancel)="cancelEdit()"
    />
  }
  <div class="btn-container">
    <app-edit-switcher></app-edit-switcher>
    <app-delete-dashboard></app-delete-dashboard>
  </div>
</nav>

<mat-tab-nav-panel #tabPanel> <router-outlet /></mat-tab-nav-panel>
