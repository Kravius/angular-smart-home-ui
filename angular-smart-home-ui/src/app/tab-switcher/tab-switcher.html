<nav mat-tab-nav-bar [tabPanel]="tabPanel">
  @for (tab of dashboardListTab().tabs; track $index) {
    <a
      mat-tab-link
      [routerLink]="['/dashboards', dashboardITabStore(), tab.id]"
      (click)="setTabsIdStore(tab.id)"
      [active]="tabId() === tab.id"
    >
      {{ tab.id | uppercase }}
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel> <router-outlet /></mat-tab-nav-panel>
